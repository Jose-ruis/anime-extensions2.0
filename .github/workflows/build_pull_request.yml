name: PR check

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 15
  IS_PR_CHECK: true

jobs:
  prepare:
    name: Prepare job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
      skipBump: ${{ steps.set-env.outputs.SKIP_BUMP }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set env
        id: set-env
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          LATEST_COMMIT_MESSAGE=$(git log -1 --pretty=%B "$HEAD_SHA")
          echo "LATEST_COMMIT_MESSAGE<<{delimiter}
          $LATEST_COMMIT_MESSAGE

          Built on commit: $HEAD_SHA
          {delimiter}" >> $GITHUB_OUTPUT

          # Commit message markers:
          #   [skip bumping version] -> skip the version bumping step only
          #   [skip ext ci]       -> skip the version bumping step and emit empty
          #                             build matrices, so the build job does not run
          skip_bump=false
          skip_build=false
          case "$LATEST_COMMIT_MESSAGE" in
            "[skip ext ci]"*)
              skip_bump=true
              skip_build=true
              ;;
            "[skip bumping version]"*)
              skip_bump=true
              ;;
          esac
          echo "SKIP_BUMP=$skip_bump" >> $GITHUB_OUTPUT
          echo "SKIP_BUILD=$skip_build" >> $GITHUB_OUTPUT
          echo "Commit $HEAD_SHA -> SKIP_BUMP=$skip_bump SKIP_BUILD=$skip_build"

      - name: Find lib changes
        id: modified-libs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: lib/
          files_ignore: lib/**.md
          files_separator: " "
          safe_output: false

      # This step is to alert whether a bumping version might occur.
      - name: Bump extensions that uses a modified lib
        if: steps.modified-libs.outputs.any_changed == 'true' && steps.set-env.outputs.SKIP_BUMP != 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
        run: |
          latest_commit_author=$(git log -1 --pretty=%an)
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x ./.github/scripts/bump-versions.py
          ./.github/scripts/bump-versions.py "$COMMIT_MESSAGE" ${{ steps.modified-libs.outputs.all_changed_files }}
          echo "!!! This PR will bumping extensions version that uses a modified lib"

      - id: generate-matrices
        name: Generate build matrices
        env:
          SKIP_BUILD: ${{ steps.set-env.outputs.SKIP_BUILD }}
        run: |
          if [ "$SKIP_BUILD" = "true" ]; then
            echo "Skipping build: emitting empty matrices."
            echo 'matrix={"chunk":[]}' >> $GITHUB_OUTPUT
            echo 'delete=[]' >> $GITHUB_OUTPUT
          else
            python ./.github/scripts/generate-build-matrices.py origin/master ${{ secrets.SIGNING_KEY != '' && 'Release' || 'Debug' }}
          fi

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          # Opcional: sin el secreto SIGNING_KEY el build firma con la clave debug.
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > signingkey.jks
            chmod 600 signingkey.jks
          else
            echo "SIGNING_KEY no configurado: se firmará con la clave debug."
          fi

      - name: Build extensions (${{ matrix.chunk.number }})
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MEGACLOUD_API: ${{ secrets.MEGACLOUD_API }}
          KISSKH_API: ${{ secrets.KISSKH_API }}
          KISSKH_SUB_API: ${{ secrets.KISSKH_SUB_API }}
          KAISVA: ${{ secrets.KAISVA }}
          TMDB_API: ${{ secrets.TMDB_API }}
          WYZIE_API: ${{ secrets.WYZIE_API }}
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
        run: |
          ./gradlew $MODULES

      - name: Upload APKs (${{ matrix.chunk.number }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: "**/*.apk"
          retention-days: 1

      - name: Clean up CI files
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Check extension repo
    needs: [prepare, build]
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: PR
          fetch-depth: 0
          persist-credentials: false

      - name: Download APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ~/apk-artifacts

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      # Authenticated, so the lookup isn't subject to the shared runner IP's anonymous rate limit
      - name: Download extensions inspector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSPECTOR_LINK="$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/komikku-app/aniyomi-extensions-inspector/releases/latest" | jq -er '.assets[0].browser_download_url')"
          curl -fL --retry 3 "$INSPECTOR_LINK" -o "$RUNNER_TEMP/Inspector.jar"

      - name: Prepare repo branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          SERVER_HOST: ${{ github.server_url }}
        run: |
          # El repositorio de extensiones vive en la rama `repo` de ESTE mismo repositorio.
          # Si todavía no existe, se crea vacía.
          HOST="${SERVER_HOST#https://}"
          AUTH_URL="https://x-access-token:${GH_TOKEN}@${HOST}/${REPO_SLUG}.git"
          if git ls-remote --exit-code --heads "$AUTH_URL" repo >/dev/null 2>&1; then
            git clone --quiet --branch repo --single-branch "$AUTH_URL" repo
          else
            mkdir repo
            git -C repo init --quiet -b repo
            git -C repo remote add origin "$AUTH_URL"
            mkdir -p repo/apk repo/icon
            echo '[]' > repo/index.json
          fi

      - name: Create repo artifacts
        working-directory: PR
        run: |
          python ./.github/scripts/move-built-apks.py
          java -jar "$RUNNER_TEMP/Inspector.jar" "repo/apk" "output.json" "tmp"
          python ./.github/scripts/create-repo.py

      - name: Merge repo
        working-directory: repo
        env:
          DELETE: ${{ needs.prepare.outputs.delete }}
        run: |
          python ../PR/.github/scripts/merge-repo.py "$DELETE" 'PR/repo'

      # Muestra qué extensiones se actualizarían con este PR
      - name: Check Deploy repo
        working-directory: repo
        run: git status
